name: CI
on:
  push:
  pull_request:
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
  evaluation-and-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: python3 tools/evaluate.py --dry-run
      - run: python3 -m pip install -e sdk/python
      - run: python3 -m unittest discover -s sdk/python/tests -p 'test_*.py'
      - run: npm ci
        working-directory: sdk/typescript
      - run: npm test
        working-directory: sdk/typescript
      - run: npm ci
        working-directory: examples/typescript-demo
      - run: npm test
        working-directory: examples/typescript-demo
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - run: mvn -B -f sdk/java/pom.xml package
