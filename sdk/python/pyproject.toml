[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-validator"
version = "0.3.0"
description = "Python SDK for direct Jev semantic validation and optional self-hosted API"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Semantic Validator"}]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
